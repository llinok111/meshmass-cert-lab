<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>meshmass-cert — exact mass properties, verified live</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0d1117; color: #d7dde5; }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  aside { padding: 14px; border-right: 1px solid #21262d; overflow: auto; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: #8b949e; font-size: 12px; margin-bottom: 12px; }
  button { display: block; width: 100%; text-align: left; margin: 3px 0; padding: 6px 8px; border: 1px solid #30363d;
           background: #161b22; color: #c9d1d9; border-radius: 6px; cursor: pointer; font: inherit; }
  button.on { border-color: #2f81f7; background: #0d2a4d; }
  button .bad { color: #f85149; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  td { padding: 2px 0; vertical-align: top; }
  td:last-child { text-align: right; color: #e6edf3; }
  .ok { color: #3fb950; } .bad { color: #f85149; } .dim { color: #8b949e; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #hint { position: absolute; left: 12px; bottom: 10px; color: #8b949e; font-size: 12px; }
  #verdict { position: absolute; right: 12px; top: 10px; font-size: 12px; text-align: right; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app">
  <aside>
    <h1>meshmass-cert</h1>
    <div class="sub">exact volume / centre of mass / inertia<br />src/core.mjs — the same module node runs</div>
    <div id="list"></div>
    <table id="hud"></table>
    <div class="dim" id="match" style="margin-top:8px"></div>
  </aside>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="verdict"></div>
    <div id="hint">drag to rotate · green = exact COM · red = vertex-mean baseline</div>
  </div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
